input "1739:0:Synaptics_TM3276-022" {
    dwt enabled
    tap enabled
    natural_scroll enabled
    middle_emulation enabled
    tap_button_map lrm
}
# exec swayidle -w \
#     timeout 3600 'swaylock -f -c 000000' \
#     timeout 3600 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
#     before-sleep 'swaylock -f -c 000000'

exec LT="$lock_timeout" ST="$screen_timeout" LT=${LT:-300} ST=${ST:-60} && \
    swayidle -w \
        timeout $LT 'swaylock -f' \
        timeout $((LT + ST)) 'swaymsg "output * power off"' \
                      resume 'swaymsg "output * power on"'  \
        timeout $ST 'pgrep -xu "$USER" swaylock -i /usr/share/backgrounds/default-dark.jxl >/dev/null && swaymsg "output * power off"' \
             resume 'pgrep -xu "$USER" swaylock -i /usr/share/backgrounds/default-dark.jxl >/dev/null && swaymsg "output * power on"'  \
        before-sleep 'swaylock -f -i /usr/share/backgrounds/default-dark.jxl' \
        lock 'swaylock -f -i /usr/share/backgrounds/default-dark.jxl' \
        unlock 'pkill -xu "$USER" -SIGUSR1 swaylock'

 bindsym $mod+Shift+Escape  exec loginctl lock-session
