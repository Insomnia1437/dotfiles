name: Test dotfiles install

on:
  # push:
  #   paths-ignore:
  #     - '**/*.md'
  # pull_request:
  #   paths-ignore:
  #     - '**/*.md'
  workflow_dispatch:

jobs:
  render_profiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - test-linux-cli
          - test-macos
          - test-wsl
          - test-desktop-xfce
          - test-desktop-kde
          - test-desktop-sway
          - test-desktop-lxde
          - test-raspi
          - test-linac
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: "Set up Python 3.9"
        uses: actions/setup-python@v7
        with:
          python-version: 3.9
      - name: "pip3 install"
        run: |
          pip3 install --user -r dotdrop/requirements.txt
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg openssh-client tcsh vim zsh
      - name: Render and validate ${{ matrix.profile }}
        id: test
        run: bash scripts/test_profile.sh "${{ matrix.profile }}"
      - uses: actions/upload-artifact@v7
        with:
          name: rendered-${{ matrix.profile }}
          retention-days: 1
          overwrite: true
          path: ${{ steps.test.outputs.review_dir }}
