config:
  backup: true
  create: true
  banner: false
  check_version: false
  force_chmod: false
  template_dotfile_default: true
  showdiff: false
  longkey: false
  keepdot: false
  link_dotfile_default: nolink
  link_on_import: nolink
  dotpath: dotfiles
  workdir: ~/.config/dotfiles
  import_variables:
    - uservariables.yaml:optional
  # default_actions:
  # - create_local_file
  cmpignore:
    - "*/README.md"
  upignore:
    - "*/README.md"
  instignore:
    - "*/README.md"
  impignore:
    - "*/README.md"
variables:
  HOME: "{{@@ env['HOME'] @@}}"
  INSTALL_HOME: "{{@@ env['HOME'] @@}}"
  REPO_HOME: "{{@@ env['PWD'] @@}}"
  REPO_SCRIPT_PATH: "{{@@ env['PWD'] @@}}/scripts"
  GIT_EMAIL_B64: "c2Rjc3dkQGdtYWlsLmNvbQ=="
  GIT_NAME_B64: "RFc="
  GITLAB_EMAIL_B64: "ZGkud2FuZ0BrZWsuanA="
  SITE: "personal"
  PLATFORM_OVERRIDE: ""
  IS_WSL: "NO"
  USE_PROXY: "NO"
  PROXY: ""
  NO_PROXY: "localhost"
  USE_GPG: "NO"
  USE_NERD_FONT: "NO"
  GPG_KEY: "DF9D81D26E95ACF5"
  GPG_KEY_GITLAB: "45B834BCEBCDEC22"
  GIT_DEPTH: "8"
  INSTALL_GIT_SH: "bash {{@@ REPO_SCRIPT_PATH @@}}/install_git.sh {{@@ GIT_DEPTH @@}}"
  FZF_VERSION: "0.65.2"
  ALACRITTY_STARTUP_MODE: "Windowed"
  ALACRITTY_FONT: "SauceCodePro Nerd Font"
  ALACRITTY_FONT_DEFAULT: "monospace"

dynvariables:
  # USER: "echo $USER"
  TMUX_VERSION: tmux -V | cut -f 2 -d " "
  GIT_HASCONFIG_REMOTE_URL: >-
    git --version | awk '{ split($3, v, "."); if (v[1] > 2 || (v[1] == 2 && v[2] >= 36)) print "YES"; else print "NO" }'
  EPICS_HOST_ARCH: bash {{@@ REPO_SCRIPT_PATH @@}}/epics_host_arch.sh
  GIT_EMAIL: echo "{{@@ GIT_EMAIL_B64 @@}}" | base64 --decode
  GIT_NAME: echo "{{@@ GIT_NAME_B64 @@}}" | base64 --decode
  GITLAB_EMAIL: echo "{{@@ GITLAB_EMAIL_B64 @@}}" | base64 --decode
  GITLAB_NAME: echo "{{@@ GIT_NAME_B64 @@}}" | base64 --decode
uservariables:
  # this will save user input value to uservariables.yaml
  # GIT_EMAIL: "git_email"
  # GIT_NAME: "git_name"
actions:
  post:
    check_local_sh: test -e {{@@ INSTALL_HOME @@}}/.config/common/local.sh || touch {{@@ INSTALL_HOME @@}}/.config/common/local.sh
    check_tcsh_local_sh: test -e {{@@ INSTALL_HOME @@}}/.tcshrc.local || touch {{@@ INSTALL_HOME @@}}/.tcshrc.local
    check_git_local: test -e {{@@ INSTALL_HOME @@}}/.gitconfig.local || (touch {{@@ INSTALL_HOME @@}}/.gitconfig.local && chmod 600 {{@@ INSTALL_HOME @@}}/.gitconfig.local)
    install_ssh_config: bash {{@@ REPO_SCRIPT_PATH @@}}/install_ssh_config.sh {{@@ INSTALL_HOME @@}}
    secure_gnupg_dir: bash {{@@ REPO_SCRIPT_PATH @@}}/secure_gnupg_dir.sh {{@@ INSTALL_HOME @@}}
    install_tpm: "{{@@ INSTALL_GIT_SH @@}} https://github.com/tmux-plugins/tpm {{@@ INSTALL_HOME @@}}/.tmux/plugins/tpm"
    install_oh_my_zsh: "{{@@ INSTALL_GIT_SH @@}} https://github.com/robbyrussell/oh-my-zsh.git {{@@ INSTALL_HOME @@}}/.oh-my-zsh"
    install_fzf: >-
      bash "{{@@ REPO_SCRIPT_PATH @@}}/install_fzf.sh"
      "{{@@ INSTALL_HOME @@}}" "{{@@ FZF_VERSION @@}}"
    install_alacritty_theme: "{{@@ INSTALL_GIT_SH @@}} https://github.com/alacritty/alacritty-theme {{@@ INSTALL_HOME @@}}/.config/alacritty/themes"
    install_zsh_autosuggestions: "{{@@ INSTALL_GIT_SH @@}} https://github.com/zsh-users/zsh-autosuggestions {{@@ INSTALL_HOME @@}}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
    install_zsh_completions: "{{@@ INSTALL_GIT_SH @@}} https://github.com/zsh-users/zsh-completions {{@@ INSTALL_HOME @@}}/.oh-my-zsh/custom/plugins/zsh-completions"
    install_zsh_syntax_highlighting: "{{@@ INSTALL_GIT_SH @@}} https://github.com/zsh-users/zsh-syntax-highlighting {{@@ INSTALL_HOME @@}}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
    install_pyenv: "{{@@ INSTALL_GIT_SH @@}} https://github.com/pyenv/pyenv.git {{@@ INSTALL_HOME @@}}/.pyenv"
    install_pyenv_virtualenv: "{{@@ INSTALL_GIT_SH @@}} https://github.com/pyenv/pyenv-virtualenv.git {{@@ INSTALL_HOME @@}}/.pyenv/plugins/pyenv-virtualenv"

dotfiles:
  d_common:
    src: common
    dst: "{{@@ INSTALL_HOME @@}}/.config/common"
    chmod: "700"
    ignore_missing_in_dotdrop: true
    actions:
      - check_local_sh
  f_pyenv:
    src: pyenv/pyenv.sh
    dst: "{{@@ INSTALL_HOME @@}}/.pyenv.sh"
    chmod: "744"
    actions:
      - install_pyenv
      - install_pyenv_virtualenv
  f_gitconfig:
    src: git/gitconfig
    dst: "{{@@ INSTALL_HOME @@}}/.gitconfig"
    chmod: "600"
    actions:
      - check_git_local
  f_gitconfig_gitlab:
    src: git/gitconfig-gitlab
    dst: "{{@@ INSTALL_HOME @@}}/.gitconfig-gitlab"
    chmod: "600"
  f_gitignore:
    src: git/ignore
    dst: "{{@@ INSTALL_HOME @@}}/.config/git/ignore"
    chmod: "644"
  f_sshconfig:
    src: ssh/config
    dst: "{{@@ INSTALL_HOME @@}}/.ssh/config.defaults"
    chmod: "600"
    actions:
      - install_ssh_config
  f_inputrc:
    src: readline/inputrc
    dst: "{{@@ INSTALL_HOME @@}}/.inputrc"
    chmod: "644"
  f_vim_theme:
    src: vim/catppuccin_latte.vim
    dst: "{{@@ INSTALL_HOME @@}}/.vim/colors/catppuccin_latte.vim"
    chmod: "644"
  f_vimrc:
    src: vim/vimrc
    dst: "{{@@ INSTALL_HOME @@}}/.vimrc"
    chmod: "644"
  f_tmuxconf:
    src: tmux/tmux.conf
    dst: "{{@@ INSTALL_HOME @@}}/.tmux.conf"
    chmod: "644"
    actions:
      - install_tpm
  f_screenrc:
    src: screen/screenrc
    dst: "{{@@ INSTALL_HOME @@}}/.screenrc"
    chmod: "644"
  f_alacritty:
    src: alacritty/alacritty.toml
    dst: "{{@@ INSTALL_HOME @@}}/.config/alacritty/alacritty.toml"
    chmod: "644"
    actions:
      - install_alacritty_theme
  f_zshrc:
    src: zsh/zshrc
    dst: "{{@@ INSTALL_HOME @@}}/.zshrc"
    chmod: "644"
    actions:
      - install_oh_my_zsh
      - install_zsh_autosuggestions
      - install_zsh_completions
      - install_zsh_syntax_highlighting
  f_fzf:
    src: fzf/fzf.sh
    dst: "{{@@ INSTALL_HOME @@}}/.fzf.sh"
    actions:
      - install_fzf
  f_zshtheme:
    src: zsh/sdcswd.zsh-theme
    dst: "{{@@ INSTALL_HOME @@}}/.oh-my-zsh/custom/themes/sdcswd.zsh-theme"
  f_dotdrop_zsh_comp:
    src: zsh/_dotdrop.sh-completion.zsh
    dst: "{{@@ INSTALL_HOME @@}}/.oh-my-zsh/custom/completions/_dotdrop.sh-completion.zsh"
    link: absolute
  f_zsh_syntax_highlighting:
    src: zsh/catppuccin_latte-zsh-syntax-highlighting.zsh
    dst: "{{@@ INSTALL_HOME @@}}/.oh-my-zsh/custom/themes/catppuccin_latte-zsh-syntax-highlighting.zsh"
    link: absolute
  f_bashrc:
    src: bash/bashrc
    dst: "{{@@ INSTALL_HOME @@}}/.bashrc"
    chmod: "644"
  f_tcshrc:
    src: tcsh/tcshrc
    dst: "{{@@ INSTALL_HOME @@}}/.tcshrc"
    chmod: "644"
    actions:
      - check_tcsh_local_sh
  f_tcshrc_epics:
    src: tcsh/tcshrc.epics
    dst: "{{@@ INSTALL_HOME @@}}/.tcshrc.epics"
    chmod: "644"
  f_konsole_theme:
    # https://github.com/catppuccin/konsole
    src: konsole/Catppuccin-Latte.colorscheme
    dst: "{{@@ INSTALL_HOME @@}}/.local/share/konsole/Catppuccin-Latte.colorscheme"
    chmod: "644"
  f_xfce4_terminal_theme:
    # https://github.com/catppuccin/xfce4-terminal
    src: xfce4-terminal/catppuccin-latte.theme
    dst: "{{@@ INSTALL_HOME @@}}/.local/share/xfce4/terminal/colorschemes/catppuccin-latte.theme"
    chmod: "644"
  f_lxterminal_theme:
    # https://github.com/catppuccin/lxterminal
    src: lxterminal/lxterminal.conf
    dst: "{{@@ INSTALL_HOME @@}}/.config/lxterminal/lxterminal.conf"
    chmod: "600"
  f_sway_config:
    src: sway/config
    dst: "{{@@ INSTALL_HOME @@}}/.config/sway/config"
    chmod: "644"
  f_sway_t480_config:
    src: sway/t480.conf
    dst: "{{@@ INSTALL_HOME @@}}/.config/sway/config.d/t480.conf"
    chmod: "644"
  f_desktop_bg:
    src: misc/bliss_windows.jpeg
    dst: "{{@@ INSTALL_HOME @@}}/.config/sway/backgrounds/bliss_windows.jpeg"
    chmod: "644"
  f_swaylock_config:
    src: swaylock/config
    dst: "{{@@ INSTALL_HOME @@}}/.config/swaylock/config"
    chmod: "600"
  f_waybar_config:
    src: waybar/config.jsonc
    dst: "{{@@ INSTALL_HOME @@}}/.config/waybar/config.jsonc"
    chmod: "644"
  f_waybar_style:
    src: waybar/style.css
    dst: "{{@@ INSTALL_HOME @@}}/.config/waybar/style.css"
    chmod: "644"
  f_mako_config:
    src: mako/config
    dst: "{{@@ INSTALL_HOME @@}}/.config/mako/config"
    chmod: "644"
  f_xvnc_config:
    src: xvnc/config
    dst: "{{@@ INSTALL_HOME @@}}/.vnc/config"
    chmod: "600"
  f_xvnc_xstartup:
    src: xvnc/xstartup
    dst: "{{@@ INSTALL_HOME @@}}/.vnc/xstartup"
    chmod: "700"
  f_locale_conf:
    src: etc/locale.conf
    dst: "{{@@ INSTALL_HOME @@}}/.config/locale.conf"
    chmod: "644"
  f_gpg_conf:
    src: gnupg/gpg.conf
    dst: "{{@@ INSTALL_HOME @@}}/.gnupg/gpg.conf"
    chmod: "600"
    actions:
      - secure_gnupg_dir
  f_gpg_agent_conf:
    src: gnupg/gpg-agent.conf
    dst: "{{@@ INSTALL_HOME @@}}/.gnupg/gpg-agent.conf"
    chmod: "600"
  f_editorconfig:
    src: misc/editorconfig
    dst: "{{@@ INSTALL_HOME @@}}/.editorconfig"
    chmod: "600"

profiles:
  # Reusable bundles and features. Install target-* profiles directly.
  bundle-cli:
    dotfiles:
      - f_zshrc
      - f_zshtheme
      - f_dotdrop_zsh_comp
      - f_zsh_syntax_highlighting
      - f_bashrc
      - f_vimrc
      - f_vim_theme
      - f_tmuxconf
      - d_common
      - f_fzf
      - f_editorconfig
      - f_inputrc
      # - f_sshconfig

  feature-git:
    dotfiles:
      - f_gitconfig
      - f_gitconfig_gitlab
      - f_gitignore

  feature-gpg:
    dotfiles:
      - f_gpg_conf
      - f_gpg_agent_conf
    variables:
      USE_GPG: "YES"

  feature-alacritty:
    dotfiles:
      - f_alacritty

  desktop-lxde:
    dotfiles:
      - f_lxterminal_theme

  feature-xvnc:
    dotfiles:
      - f_xvnc_config
      - f_xvnc_xstartup

  feature-tcsh:
    dotfiles:
      - f_tcshrc
      - f_screenrc

  feature-tcsh-epics:
    dotfiles:
      - f_tcshrc_epics

  platform-wsl:
    variables:
      IS_WSL: "YES"

  desktop-xfce:
    dotfiles:
      - f_xfce4_terminal_theme
      - f_locale_conf

  desktop-kde:
    dotfiles:
      - f_konsole_theme
      - f_locale_conf

  desktop-sway:
    dotfiles:
      - f_locale_conf
      - f_sway_config
      - f_sway_t480_config
      - f_desktop_bg
      - f_swaylock_config
      - f_waybar_config
      - f_waybar_style
      - f_mako_config

  site-linac:
    variables:
      SITE: "linac"
      USE_PROXY: "YES"
      PROXY: "172.19.64.17:8080"
      NO_PROXY: "localhost,172.19.64.0/19"

  # Final deployment targets.
  target-default-cli:
    include:
      - bundle-cli
      - feature-git

  target-vps:
    include:
      - bundle-cli
    variables:
      # Some VPS hosts still have Git versions that cannot use shallow pulls.
      GIT_DEPTH: "0"
      INSTALL_GIT_SH: "bash {{@@ REPO_SCRIPT_PATH @@}}/install_git.sh {{@@ GIT_DEPTH @@}}"

  target-wsl:
    include:
      - bundle-cli
      - feature-git
      - feature-gpg
      - platform-wsl

  target-desktop-lxde:
    include:
      - bundle-cli
      - desktop-lxde

  target-raspi:
    include:
      - target-desktop-lxde
    variables:
      PLATFORM_OVERRIDE: "raspios"

  target-linac:
    include:
      - bundle-cli
      - feature-git
      - feature-alacritty
      - feature-tcsh
      - feature-tcsh-epics
      - feature-xvnc
      - desktop-xfce
      - site-linac

  target-desktop-xfce:
    include:
      - bundle-cli
      - feature-git
      - feature-alacritty
      - desktop-xfce

  target-desktop-kde:
    include:
      - bundle-cli
      - feature-git
      - feature-alacritty
      - desktop-kde
    variables:
      USE_NERD_FONT: "YES"

  target-desktop-sway:
    include:
      - bundle-cli
      - feature-git
      - feature-alacritty
      - desktop-sway

  target-macos:
    include:
      - bundle-cli
      - feature-git
      - feature-alacritty
      - feature-gpg
    variables:
      USE_NERD_FONT: "YES"
      ALACRITTY_STARTUP_MODE: "Maximized"


  # Rendering profiles for the CI matrix.
  test-all:
    dotfiles:
      - ALL
    variables:
      INSTALL_HOME: "/tmp"
      USE_PROXY: "YES"
      PROXY: "172.19.64.17:8080"
      NO_PROXY: "localhost"
      USE_GPG: "YES"

  test-linux-cli:
    include:
      - target-default-cli
    variables:
      INSTALL_HOME: "/tmp/dotdrop-test-linux-cli"

  test-macos:
    include:
      - target-macos
    variables:
      INSTALL_HOME: "/tmp/dotdrop-test-macos"

  test-wsl:
    include:
      - target-wsl
    variables:
      INSTALL_HOME: "/tmp/dotdrop-test-wsl"

  test-desktop-xfce:
    include:
      - target-desktop-xfce
    variables:
      INSTALL_HOME: "/tmp/dotdrop-test-desktop-xfce"

  test-desktop-kde:
    include:
      - target-desktop-kde
    variables:
      INSTALL_HOME: "/tmp/dotdrop-test-desktop-kde"

  test-desktop-sway:
    include:
      - target-desktop-sway
    variables:
      INSTALL_HOME: "/tmp/dotdrop-test-desktop-sway"

  test-desktop-lxde:
    include:
      - target-desktop-lxde
    variables:
      INSTALL_HOME: "/tmp/dotdrop-test-desktop-lxde"

  test-raspi:
    include:
      - target-raspi
    variables:
      INSTALL_HOME: "/tmp/dotdrop-test-raspi"

  test-linac:
    include:
      - target-linac
    variables:
      INSTALL_HOME: "/tmp/dotdrop-test-linac"
